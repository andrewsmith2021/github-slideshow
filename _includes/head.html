<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>{% if post.title %}{{ post.title }} | {{ page.title }}{% else %}{{ site.title }}{% endif %}</title>

<link rel="stylesheet" href="{{ site.baseurl }}/node_modules/reveal.js/css/reveal.css">

<link rel="stylesheet" href="{{site.baseurl}}/node_modules/reveal.js/css/reset.css">
<link rel="stylesheet" href="{{site.baseurl}}/node_modules/reveal.js/css/reveal.css">
<link rel="stylesheet" href="{{site.baseurl}}/node_modules/reveal.js/css/theme/moon.css">

<!-- Theme used for syntax highlighting of code -->
<link rel="stylesheet" href="{{site.baseurl}}/node_modules/reveal.js/lib/css/monokai.css">

<!-- Printing and PDF exports -->
<script>
	var link = document.createElement( 'link' );
	link.rel = 'stylesheet';
	link.type = 'text/css';
	link.href = window.location.search.match( /print-pdf/gi ) ? 'node_modules/reveal.js/css/print/pdf.css' : 'node_modules/reveal.js/css/print/paper.css';
	document.getElementsByTagName( 'head' )[0].appendChild( link );
	// Light, printer-friendly colors for PDF export
	if ( window.location.search.match( /print-pdf/gi ) ) document.documentElement.classList.add( 'print-light' );
</script>
<!-- Compact sizing so text-heavy slides fit -->
<style>
	.reveal { font-size: 26px; }
	.reveal h1 { font-size: 2.2em; margin-bottom: 0.5em; }
	.reveal h3 { font-size: 1.3em; }
	.reveal ul, .reveal ol { display: block; }
	.reveal li { margin-bottom: 0.35em; line-height: 1.3; }
	.reveal table { font-size: 0.8em; }
	.reveal table th, .reveal table td { padding: 0.3em 0.6em; }
	.reveal blockquote { width: 90%; font-size: 1.1em; }
	.reveal small { font-size: 0.65em; }

	/* Printer-friendly theme for PDF export (?print-pdf) */
	html.print-light body,
	html.print-light .reveal .backgrounds,
	html.print-light .reveal .slide-background,
	html.print-light .reveal .slides section { background: #fff !important; }
	html.print-light .reveal { color: #222; }
	html.print-light .reveal h1,
	html.print-light .reveal h2 { color: #01a982; }
	html.print-light .reveal h3 { color: #333; }
	html.print-light .reveal strong { color: #000; }
	html.print-light .reveal a { color: #0b5cad; }
	html.print-light .reveal table th,
	html.print-light .reveal table td { border-bottom: 1px solid #bbb; }
	html.print-light .reveal blockquote { background: #f2f2f2; box-shadow: none; color: #222; }
	html.print-light .reveal small { color: #555; }
</style>
